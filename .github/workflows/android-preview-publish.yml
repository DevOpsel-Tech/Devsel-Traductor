name: Publicar descargas Windows y Android actualizadas

on:
  workflow_run:
    workflows: ["Build applications"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: descargas-estables
  cancel-in-progress: false

jobs:
  publish:
    # Solo se aceptan compilaciones satisfactorias de pushes a main.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      TAG: descargas-latest
    steps:
      - name: Comprobar que esta compilación sigue siendo la última
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          # Una ejecución antigua no debe sobrescribir los instaladores más recientes.
          current_sha=$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')
          if [ "$current_sha" = "$BUILD_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Compilación obsoleta: no se publicará"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar artefactos Windows y Android
        if: steps.latest.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # El nombre debe coincidir exactamente con build.yml (windows-latest).
          gh run download "$RUN_ID" --name traductor-windows-latest --dir windows-artifact
          gh run download "$RUN_ID" --name traductor-android-debug --dir android-artifact

      - name: Preparar y validar los tres descargables
        if: steps.latest.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          mapfile -d '' setup < <(find windows-artifact -type f -iname '*.exe' -print0)
          mapfile -d '' portable < <(find windows-artifact -type f -name 'TraductorPDF-Windows-x64-portable.zip' -print0)
          mapfile -d '' apk < <(find android-artifact -type f -name '*.apk' -print0)
          test "${#setup[@]}" -eq 1
          test "${#portable[@]}" -eq 1
          test "${#apk[@]}" -eq 1
          cp "${setup[0]}" publish/TraductorPDF-Windows-x64-setup.exe
          cp "${portable[0]}" publish/TraductorPDF-Windows-x64-portable.zip
          cp "${apk[0]}" publish/TraductorPDF-Android-ARM64-prueba.apk
          (cd publish && sha256sum *.exe *.zip *.apk > SHA256SUMS.txt)

      - name: Actualizar la Release de descargas estables
        if: steps.latest.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # El tag y los nombres de archivo permanecen fijos; cambian los binarios.
          # Revalidar el SHA justo antes de sustituir archivos publicados.
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$BUILD_SHA" || { echo "main avanzó durante la compilación"; exit 1; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$BUILD_SHA" --prerelease \
              --title "Descargas actuales (Windows y Android)" \
              --notes "Compilaciones de prueba actualizadas desde main. Windows sin firma digital y Android con firma de depuración. Validar instalación en dispositivos reales."
          fi
          gh release upload "$TAG" publish/* --clobber
