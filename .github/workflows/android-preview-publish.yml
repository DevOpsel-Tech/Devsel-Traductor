name: Publicar APK Android de prueba
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-preview-publish.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: d5c6c24808f4e69502080679d5eb1c3d4ccb70fb
    steps:
      - name: Esperar y descargar la compilación Android verificada
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..100}; do
            run_id=$(gh run list --workflow build.yml --commit "$BUILD_SHA" --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              job=$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs" --jq '.jobs[] | select(.name == "android") | [.status, (.conclusion // "")] | @tsv')
              if [[ "$job" == $'completed\tsuccess' ]]; then
                gh run download "$run_id" --name traductor-android-debug --dir android-artifact
                exit 0
              fi
              if [[ "$job" == completed* ]]; then
                echo "La compilación Android falló: $job"
                exit 1
              fi
            fi
            sleep 15
          done
          echo "No terminó la compilación Android a tiempo."
          exit 1
      - name: Publicar APK de prueba
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find android-artifact -type f -name '*.apk' -print0)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Se esperaba exactamente un APK; encontrados: ${#files[@]}"
            exit 1
          fi
          cp "${files[0]}" TraductorPDF-Android-ARM64-prueba.apk
          sha256sum TraductorPDF-Android-ARM64-prueba.apk > SHA256SUMS-Android.txt
          gh release create android-prueba-d5c6c24 TraductorPDF-Android-ARM64-prueba.apk SHA256SUMS-Android.txt --target "$BUILD_SHA" --prerelease --title "Android - paneles móviles" --notes "APK ARM64 de prueba con paneles adaptados a móviles. Firma de depuración; aún no se ha validado en un dispositivo."
