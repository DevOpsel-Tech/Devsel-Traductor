name: Publicar APK Android actualizada

on:
  workflow_run:
    workflows: ["Build applications"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publicar-android
  cancel-in-progress: false

jobs:
  publish:
    # Android se publica independientemente de Windows y solo desde main.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      TAG: android-actual
    steps:
      - name: Verificar commit y trabajo Android
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          # Las compilaciones antiguas no pueden sustituir a las nuevas.
          current_sha=$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')
          if [ "$current_sha" != "$BUILD_SHA" ]; then
            echo "El código de main ha avanzado: se omite esta ejecución"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No condicionamos Android al resultado independiente de Windows.
          conclusion=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "android") | .conclusion][0] // ""')
          if [ "$conclusion" != "success" ]; then
            echo "La compilación Android no ha finalizado correctamente: $conclusion"
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Descargar y validar la APK
        if: steps.verify.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --name traductor-android-debug --dir android-artifact
          mapfile -d '' files < <(find android-artifact -type f -name '*.apk' -print0)
          # No publicar si la compilación no entregó exactamente un APK válido.
          test "${#files[@]}" -eq 1
          test -s "${files[0]}"
          mkdir -p publish
          cp "${files[0]}" publish/TraductorPDF-Android-ARM64-prueba.apk
          (cd publish && sha256sum TraductorPDF-Android-ARM64-prueba.apk > SHA256SUMS-Android.txt)

      - name: Publicar APK con enlace permanente
        if: steps.verify.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Revalidar main antes de cambiar una descarga que ya existe.
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$BUILD_SHA"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$BUILD_SHA" --prerelease \
              --title "Android: compilación actual" \
              --notes "APK ARM64 de depuración. Código fuente: $BUILD_SHA. No validada en un dispositivo."
          fi
          gh release upload "$TAG" publish/* --clobber
          gh release edit "$TAG" --notes "APK ARM64 de depuración. Código fuente: $BUILD_SHA. No validada en un dispositivo."
          # Comprobar que GitHub registra ambos archivos antes de dar por buena la publicación.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          grep -Fxq 'TraductorPDF-Android-ARM64-prueba.apk' <<< "$assets"
          grep -Fxq 'SHA256SUMS-Android.txt' <<< "$assets"
