name: Build applications

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: traductor-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: sdkmanager "ndk;27.2.12479018"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run tauri android init -- --ci --skip-targets-install
      - run: npm run tauri icon app-icon.png
      - run: npm run tauri android build -- --debug --apk --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: traductor-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
